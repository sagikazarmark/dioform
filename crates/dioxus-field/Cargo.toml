[package]
name = "dioxus-field"
version = "0.1.0"
publish = false
description = "A form-library-agnostic field convention for Dioxus"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["dioxus", "field", "binding", "headless"]
categories = ["web-programming", "gui"]

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["hooks", "html", "macro", "signals"] }
dioxus-core = "=0.7.10"
dioxus-hooks = "=0.7.10"
dioxus-signals = "=0.7.10"

[dev-dependencies]
dioxus-ssr = "=0.7.10"

[package.metadata.release]
release = false
shared-version = false
