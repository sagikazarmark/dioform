[package]
name = "dioform-core"
version.workspace = true
description = "Renderer-agnostic typed form state core for Dioform"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
# Workspace-only doctests must not create a publication cycle with dioform-derive.
dioform-derive = { path = "../dioform-derive" }
